# Project-specific settings read by feature-orchestrator and project-scoper.
# Skill logic in .claude/skills/ (installed via agentic-sdlc-core's install.ps1) should never
# hardcode any of these values directly — that's what caused the original
# build-feature bug this project was generalized away from.

agentic_sdlc_core_version: "5.4.1"   # keep in sync with the -Ref passed to install.ps1

# Default context_mode assigned to a story when story-converter (spec mode)
# has no clear reason to override it. Can still be overridden per story.
context_mode_default: decision-log-only

risk_thresholds:
  l1_max_files: 1        # above this, risk-classifier should not return L1
  l1_excludes:            # never classify these as L1 regardless of file count
    - auth
    - payments
    - migrations

ticket_system:
  provider: jira          # jira | azure-devops
  project_key: CHANGE_ME
  # board_id / org_url / etc. as needed by your Jira or ADO integration

state_dir: .claude/state

# Thresholds for scripts/rotate-decision-log.ps1 — not read automatically by any
# skill or agent, since that script doesn't parse this file. Keep these two values
# in sync with the -MaxAgeMonths/-MaxEntries you actually pass when running it;
# they're documentation of your team's policy, not enforced from here.
decision_log_rotation:
  max_age_months: 6
  max_entries: 200
