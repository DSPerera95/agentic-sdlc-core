# Project-specific settings read by feature-orchestrator and project-planner.
# Skill logic in .claude/skills/ (installed via agentic-sdlc-core's install.ps1) should never
# hardcode any of these values directly — that's what caused the original
# build-feature bug this project was generalized away from.

agentic_sdlc_core_version: "5.4.1"   # keep in sync with the -Ref passed to install.ps1

# Default context_mode assigned to a story when story-converter (spec mode)
# has no clear reason to override it. Can still be overridden per story.
# One of: full-spec | decision-log-only | independent
context_mode_default: decision-log-only

risk_thresholds:
  l1_max_files: 1        # a strong signal, not a hard rule - above this, risk-classifier
                          # usually shouldn't return L1, but can override with explicit reasons
  l1_excludes:            # an absolute floor - never L1 for these, regardless of file count
    - auth
    - payments
    - migrations

ticket_system:
  provider: jira          # jira | azure-devops
  project_key: CHANGE_ME
  # board_id / org_url / etc. as needed by your Jira or ADO integration

state_dir: .claude/state

# Where per-story state is written, one folder per story (<story-id>/, no
# slug - see story_file_name_format below for where the slug shows up
# instead). Independently configurable, not assumed to sit inside state_dir
# above - point it wherever suits this project's layout.
stories_dir: .claude/state/stories

# Template for the spec/plan file basename, before the automatic "-v<N>"
# version suffix and extension are appended. Available placeholders:
# {ticket_id}, {slug}. Rendered once per story and reused for both spec/
# and plan/ - only the extension (.md vs .json) and version number differ
# between them.
story_file_name_format: "{ticket_id}-{slug}"

# Where architecture-mode diagrams (Mermaid) are saved. Only used when
# architecture mode is on and at least one diagram is generated. Independently
# configurable, not assumed to sit inside state_dir - point it wherever suits
# this project's documentation layout.
diagrams_dir: docs/architecture/diagrams

# Thresholds for scripts/rotate-decision-log.ps1 — not read automatically by any
# skill or agent, since that script doesn't parse this file. Keep these two values
# in sync with the -MaxAgeMonths/-MaxEntries you actually pass when running it;
# they're documentation of your team's policy, not enforced from here.
decision_log_rotation:
  max_age_months: 6
  max_entries: 200

# Where story-backlog.json and decision-log.jsonl are stored and accessed from.
# 'file' (default): plain files under state_dir, read/written directly - zero
# external dependencies, right for a solo engineer or a small team without
# real concurrent-branch contention on this state.
# 'turso': routes story-backlog/decision-log reads and writes through a local
# MCP server (.claude/mcp-servers/turso-state/) backed by a hosted Turso
# database - opt into this once multiple engineers are running
# feature-orchestrator concurrently on separate branches against the same
# backlog/decision log. Only story-backlog.json and decision-log.jsonl move
# to Turso in this mode - everything under stories_dir stays plain files
# either way. See agentic-sdlc-core's
# docs/features/specs/2026-09-11-turso-state-backend-design.md for the
# full design.
state_backend: file   # file | turso

# Only read when state_backend is turso. The database URL is an identifier,
# not a secret - safe to commit here. The auth token is NEVER stored here or
# anywhere else committed to this repo: each engineer runs
# .claude/scripts/setup-mcp-server.ps1 -Name turso-state -EnvVars @{...}
# once, from their own scoped Turso token, which writes it to a gitignored
# .claude/mcp-servers/turso-state.env.local instead. install.ps1 never
# touches credentials or this setting.
turso:
  database_url: libsql://<db-name>-<org>.turso.io
